# =============================================================================
# SailPoint IdentityIQ - iiq.properties
# Database connection configuration for MySQL
# =============================================================================

# -- Database Type ------------------------------------------------------------
# Options: MySQL, SQLServer, Oracle, DB2
datasource=identityiqDataSource

# -- Hibernate dialect --------------------------------------------------------
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# -- JDBC Driver --------------------------------------------------------------
dataSource.driverClassName=com.mysql.cj.jdbc.Driver

# -- Connection URL -----------------------------------------------------------
# iiq-mysql is the Docker service/container name resolved via Docker network DNS
dataSource.url=jdbc:mysql://iiq-mysql:3306/identityiq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true

# -- Credentials --------------------------------------------------------------
dataSource.username=identityiq
dataSource.password=identityiq

# -- Connection Pool (c3p0) ---------------------------------------------------
dataSource.minPoolSize=5
dataSource.maxPoolSize=20
dataSource.maxIdleTime=600
dataSource.acquireIncrement=2

# -- Plugin Database ----------------------------------------------------------
# Uses the same MySQL instance, separate schema
pluginsDataSource.url=jdbc:mysql://iiq-mysql:3306/identityiqPlugin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
pluginsDataSource.username=identityiq
pluginsDataSource.password=identityiq
pluginsDataSource.driverClassName=com.mysql.cj.jdbc.Driver

# -- File Paths ---------------------------------------------------------------
# FILE_SHARE is a Docker volume defined in docker-compose.yml
exportFilesPath=/FILE_SHARE
importFilesPath=/FILE_SHARE

# -- Logging ------------------------------------------------------------------
# Logs are written to stdout (captured by Docker logging infrastructure)
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.rootLogger=WARN, stdout
